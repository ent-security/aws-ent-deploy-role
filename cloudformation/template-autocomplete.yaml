AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM Role for cross-account access with full permissions for deployment,
  plus a one-shot custom-resource Lambda that POSTs the role details back
  to Ent so the tenant deployment can start automatically.

Parameters:
  EntCallbackUrl:
    Type: String
    Description: HTTPS URL Ent expects the stack-creation callback to POST to. Pre-filled by the Launch Stack URL.
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^\s]*)?$'
    ConstraintDescription: Must be an https:// URL.

  EntWebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Per-deal HMAC secret used to sign the callback POST. Generated by
      Ent and pre-filled from the Launch Stack URL — leave it as is.

  EntTenantName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9 _-]{0,49}$'
    ConstraintDescription: >
      Up to 50 chars; letters, digits, spaces, underscores, hyphens.
      Must start with a letter or digit. Leave blank to use the survey value.
    Description: >
      Display name for this Ent tenant. Pre-filled from your survey response,
      but you can change it here before clicking Create stack.

  EntAwsAccountArn:
    Type: String
    Default: arn:aws:iam::051759900972:role/prod-uswest1-eks-pi-1-20251203221124633900000005
    Description: The AWS ARN that can assume this role

  RoleStsExternalId:
    Type: String
    Default: ''
    Description: STS ExternalId condition value to use with the role

  RoleName:
    Type: String
    Default: HomeProdAssumeAdmin
    Description: IAM role name

  RolePath:
    Type: String
    Default: /
    Description: Path of IAM role

  RoleDescription:
    Type: String
    Default: Role that allows HomeDev SSO to assume AdministratorAccess role
    Description: IAM Role description

  PolicyNamePrefix:
    Type: String
    Default: EntHomeAccess
    Description: >
      Name prefix for the four managed policies, applied as <prefix>Compute,
      <prefix>Data, <prefix>Security, and <prefix>Platform. Defaults to
      EntHomeAccess to match the Terraform, CDK, and Pulumi variants. Override it
      if you need more than one deploy-role stack in the same AWS account, since
      IAM managed-policy names are account-global.

Conditions:
  HasExternalId: !Not [!Equals [!Ref RoleStsExternalId, '']]

Resources:
  EntDeployPolicyCompute:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Compute'
      Description: Ent Home deploy permissions (Compute & Networking) — 1 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EC2Access
            Effect: Allow
            Action:
              - ec2:*
            Resource: '*'
          - Sid: ECRAccess
            Effect: Allow
            Action:
              - ecr:*
            Resource: !Sub 'arn:${AWS::Partition}:ecr:*:*:repository/e???????????????-*'
          - Sid: ECRAuthTokenAccess
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EKSAccess
            Effect: Allow
            Action:
              - eks:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:*:*:cluster/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:nodegroup/e???????????????-*/*/*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:access-entry/e???????????????-*/*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:addon/e???????????????-*/*/*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:podidentityassociation/e???????????????-*/*'
          - Sid: EKSDescribeAddonVersionsAccess
            Effect: Allow
            Action:
              - eks:DescribeAddonVersions
            Resource: '*'
          - Sid: ELBAccess
            Effect: Allow
            Action:
              - elasticloadbalancing:*
            Resource: '*'
          - Sid: Route53Access
            Effect: Allow
            Action:
              - route53:*
            Resource: '*'

  EntDeployPolicyData:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Data'
      Description: Ent Home deploy permissions (Data & Storage) — 2 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AthenaAccess
            Effect: Allow
            Action:
              - athena:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:athena:*:*:workgroup/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:athena:*:*:datacatalog/e???????????????-*'
          - Sid: EFSAccess
            Effect: Allow
            Action:
              - elasticfilesystem:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:elasticfilesystem:*:*:file-system/*'
              - !Sub 'arn:${AWS::Partition}:elasticfilesystem:*:*:access-point/*'
          - Sid: ElastiCacheAccess
            Effect: Allow
            Action:
              - elasticache:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:cluster:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:replicationgroup:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:parametergroup:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:subnetgroup:e???????????????-*'
          - Sid: GlueAccess
            Effect: Allow
            Action:
              - glue:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:glue:*:*:catalog'
              - !Sub 'arn:${AWS::Partition}:glue:*:*:database/e???????????????*'
              - !Sub 'arn:${AWS::Partition}:glue:*:*:table/e???????????????*/*'
          - Sid: RDSAccess
            Effect: Allow
            Action:
              - rds:*
              - rds-db:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:rds:*:*:db:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:cluster:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:pg:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:subgrp:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:es:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:es:db-event-sub-*'
              - !Sub 'arn:${AWS::Partition}:rds-db:*:*:dbuser:*/*'
          - Sid: RDSDescribeAccess
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
            Resource: '*'
          - Sid: S3Access
            Effect: Allow
            Action:
              - s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:s3:::e???????????????-*/*'
          - Sid: S3ListAllMyBucketsAccess
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'
          - Sid: S3AccountPublicAccessBlockAccess
            Effect: Allow
            Action:
              - s3:GetAccountPublicAccessBlock
            Resource: '*'

  EntDeployPolicySecurity:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Security'
      Description: Ent Home deploy permissions (Identity & Security) — 3 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CertificateManagerAccess
            Effect: Allow
            Action:
              - acm:*
            Resource: '*'
          - Sid: IAMAccess
            Effect: Allow
            Action:
              - iam:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::*:role/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:policy/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:instance-profile/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:policy/AmazonEKS_*'
              - !Sub 'arn:${AWS::Partition}:iam::*:oidc-provider/oidc.eks.*.amazonaws.com/*'
          - Sid: IAMSessionContextAccess
            Effect: Allow
            Action:
              - iam:GetRole
            Resource: '*'
          - Sid: IAMServiceLinkedRoleAccess
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/aws-service-role/*'
            Condition:
              StringLike:
                'iam:AWSServiceName':
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
                  - eks-fargate-pods.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
                  - opensearchservice.amazonaws.com
                  - backup.amazonaws.com
                  - elasticfilesystem.amazonaws.com
          - Sid: KMSAccess
            Effect: Allow
            Action:
              - kms:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:kms:*:*:key/*'
              - !Sub 'arn:${AWS::Partition}:kms:*:*:alias/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:kms:*:*:alias/eks/e???????????????-*'
          - Sid: KMSAccountLevelAccess
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:ListAliases
            Resource: '*'
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
              - secretsmanager:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:mks*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:rds!*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:grafana/????????-????-????-????-????????????-*/*'
          - Sid: STSAssumeRoleAccess
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:AssumeRoleWithWebIdentity
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/e???????????????-*'
          - Sid: STSIdentityAccess
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - sts:DecodeAuthorizationMessage
              - sts:GetAccessKeyInfo
            Resource: '*'
          - Sid: WAFv2Access
            Effect: Allow
            Action:
              - wafv2:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:wafv2:*:*:regional/webacl/e???????????????-*/*'
              - !Sub 'arn:${AWS::Partition}:wafv2:*:*:global/webacl/e???????????????-*/*'

  EntDeployPolicyPlatform:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Platform'
      Description: Ent Home deploy permissions (Observability & Platform) — 4 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockAccess
            Effect: Allow
            Action:
              - bedrock:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
          - Sid: CostAndUsageReportAccess
            Effect: Allow
            Action:
              - cur:Describe*
              - cur:Get*
              - cur:PutReportDefinition
            Resource: '*'
          - Sid: BCMDataExportsAccess
            Effect: Allow
            Action:
              - bcm-data-exports:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:bcm-data-exports:*:*:export/*'
              - !Sub 'arn:${AWS::Partition}:bcm-data-exports:*:*:table/*'
          - Sid: CloudWatchAccess
            Effect: Allow
            Action:
              - cloudwatch:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudwatch:*:*:alarm:e???????????????-*'
          - Sid: CloudWatchLogsAccess
            Effect: Allow
            Action:
              - logs:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:/aws/*/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:/????????-????-????-????-????????????/*'
          - Sid: CloudWatchLogsDescribeAccess
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: '*'
          - Sid: ResourceGroupsAccess
            Effect: Allow
            Action:
              - resource-groups:*
            Resource: !Sub 'arn:${AWS::Partition}:resource-groups:*:*:group/e???????????????-*'
          - Sid: SNSAccess
            Effect: Allow
            Action:
              - sns:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:sns:*:*:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:sns:*:*:db-event-notifications'
          - Sid: SQSAccess
            Effect: Allow
            Action:
              - sqs:*
            Resource: !Sub 'arn:${AWS::Partition}:sqs:*:*:e???????????????-*'
          - Sid: TaggingAccess
            Effect: Allow
            Action:
              - tag:*
            Resource: '*'
          - Sid: ServiceQuotasEC2Access
            Effect: Allow
            Action:
              - servicequotas:GetServiceQuota
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota
              - servicequotas:RequestServiceQuotaIncrease
            Resource: !Sub 'arn:${AWS::Partition}:servicequotas:*:*:ec2/*'
          - Sid: ServiceQuotasListAccess
            Effect: Allow
            Action:
              - servicequotas:ListServiceQuotas
            Resource: '*'

  EntDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Path: !Ref RolePath
      Description: !Ref RoleDescription
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        # When an ExternalId is set, sts:AssumeRole keeps the ExternalId condition (confused-deputy
        # protection) but sts:TagSession is split into its own statement WITHOUT the condition. STS
        # only populates sts:ExternalId when authorizing sts:AssumeRole, not sts:TagSession; the Ent
        # Home deploy identity uses EKS Pod Identity, whose transitive session tags force an
        # sts:TagSession authorization alongside every cross-account assume, so gating TagSession on
        # sts:ExternalId would deny it. With no ExternalId, both actions stay in one statement.
        Statement: !If
          - HasExternalId
          - - Sid: EntDeployAssumeRole
              Effect: Allow
              Principal:
                AWS: !Ref EntAwsAccountArn
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  sts:ExternalId: !Ref RoleStsExternalId
            - Sid: EntDeployTagSession
              Effect: Allow
              Principal:
                AWS: !Ref EntAwsAccountArn
              Action: sts:TagSession
          - - Effect: Allow
              Principal:
                AWS: !Ref EntAwsAccountArn
              Action:
                - sts:AssumeRole
                - sts:TagSession
      ManagedPolicyArns:
        - !Ref EntDeployPolicyCompute
        - !Ref EntDeployPolicyData
        - !Ref EntDeployPolicySecurity
        - !Ref EntDeployPolicyPlatform

  CallbackLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  CallbackLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CallbackLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json, urllib.request, hmac, hashlib, base64, signal
          import cfnresponse


          class HardTimeout(Exception):
              pass


          def _raise_timeout(*_):
              raise HardTimeout()


          def handler(event, context):
              if event['RequestType'] != 'Create':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              # urllib's timeout covers socket ops only; signal.alarm guarantees
              # we always send a CFN response within Lambda's outer Timeout, even
              # if the runtime wedges below the urllib layer.
              signal.signal(signal.SIGALRM, _raise_timeout)
              signal.alarm(45)

              reason = 'Unknown error.'
              try:
                  props = event['ResourceProperties']
                  payload = {
                      'stackId': event['StackId'],
                      'roleArn': props['RoleArn'],
                      'externalId': props.get('ExternalId', ''),
                      'region': props['Region'],
                      'tenantName': props.get('TenantName', ''),
                  }
                  body = json.dumps(payload).encode('utf-8')
                  # HMAC keyed by EntWebhookSecret (NoEcho), NOT ExternalId.
                  # ExternalId is plaintext in the trust policy and visible via
                  # iam:GetRole / CloudTrail by AWS design — using it as the
                  # HMAC key would let anyone with iam:GetRole access in this
                  # account forge callbacks.
                  key = props['WebhookSecret'].encode('utf-8')
                  sig = base64.b64encode(
                      hmac.new(key, body, hashlib.sha256).digest()
                  ).decode()
                  req = urllib.request.Request(
                      props['CallbackUrl'],
                      data=body,
                      headers={
                          'Content-Type': 'application/json',
                          'X-Ent-Signature': sig,
                      },
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      if 200 <= resp.status < 300:
                          cfnresponse.send(
                              event, context, cfnresponse.SUCCESS, {}
                          )
                          return
                      reason = (
                          f'Ent endpoint returned HTTP {resp.status}. '
                          'Please retry by deleting and re-creating this stack.'
                      )
              except HardTimeout:
                  reason = (
                      'Timed out reaching Ent endpoint after 45s. Please retry.'
                  )
              except Exception as e:
                  reason = (
                      f'Could not reach Ent endpoint at '
                      f'{event.get("ResourceProperties", {}).get("CallbackUrl")}: '
                      f'{e}. Please retry.'
                  )
              finally:
                  signal.alarm(0)

              cfnresponse.send(
                  event, context, cfnresponse.FAILED, {}, reason=reason
              )

  EntDeployCallback:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: EntDeployRole
    Properties:
      ServiceToken: !GetAtt CallbackLambda.Arn
      RoleArn: !GetAtt EntDeployRole.Arn
      ExternalId: !Ref RoleStsExternalId
      WebhookSecret: !Ref EntWebhookSecret
      Region: !Ref AWS::Region
      CallbackUrl: !Ref EntCallbackUrl
      TenantName: !Ref EntTenantName

Outputs:
  RoleArn:
    Description: The ARN of the role
    Value: !GetAtt EntDeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RoleArn

  RoleName:
    Description: The name of the role
    Value: !Ref EntDeployRole
    Export:
      Name: !Sub ${AWS::StackName}-RoleName

  PolicyArnCompute:
    Description: The ARN of the Compute & Networking managed policy
    Value: !Ref EntDeployPolicyCompute
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnCompute
  PolicyArnData:
    Description: The ARN of the Data & Storage managed policy
    Value: !Ref EntDeployPolicyData
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnData
  PolicyArnSecurity:
    Description: The ARN of the Identity & Security managed policy
    Value: !Ref EntDeployPolicySecurity
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnSecurity
  PolicyArnPlatform:
    Description: The ARN of the Observability & Platform managed policy
    Value: !Ref EntDeployPolicyPlatform
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnPlatform
  PolicyArn:
    Description: Deprecated — points at the Identity & Security policy for backward compatibility; use the per-domain PolicyArn* outputs
    Value: !Ref EntDeployPolicySecurity
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArn
