AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM Role for cross-account access with full permissions for deployment,
  plus a one-shot custom-resource Lambda that POSTs the role details back
  to Ent so the tenant deployment can start automatically.

Parameters:
  EntCallbackUrl:
    Type: String
    Description: HTTPS URL Ent expects the stack-creation callback to POST to. Pre-filled by the Launch Stack URL.
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[^\s]*)?$'
    ConstraintDescription: Must be an https:// URL.

  EntWebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Per-deal HMAC secret used to sign the callback POST. Generated by
      Ent and pre-filled from the Launch Stack URL — leave it as is.

  EntTenantName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9 _-]{0,49}$'
    ConstraintDescription: >
      Up to 50 chars; letters, digits, spaces, underscores, hyphens.
      Must start with a letter or digit. Leave blank to use the survey value.
    Description: >
      Display name for this Ent tenant. Pre-filled from your survey response,
      but you can change it here before clicking Create stack.

  EntAwsAccountArn:
    Type: String
    Default: arn:aws:iam::051759900972:role/prod-uswest1-eks-pi-1-20251203221124633900000005
    Description: The AWS ARN that can assume this role

  RoleStsExternalId:
    Type: String
    Default: ''
    Description: STS ExternalId condition value to use with the role

  RoleName:
    Type: String
    Default: HomeProdAssumeAdmin
    Description: IAM role name

  RolePath:
    Type: String
    Default: /
    Description: Path of IAM role

  RoleDescription:
    Type: String
    Default: Role that allows HomeDev SSO to assume AdministratorAccess role
    Description: IAM Role description

Conditions:
  HasExternalId: !Not [!Equals [!Ref RoleStsExternalId, '']]

Resources:
  EntDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EntAdditionalPermissions
      Description: Custom policy for permissions needed by Ent Home to deploy and manage resources in customer accounts
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CertificateManagerAccess
            Effect: Allow
            Action:
              - acm:*
            Resource: '*'
          - Sid: AthenaAccess
            Effect: Allow
            Action:
              - athena:*
            Resource:
              - arn:aws:athena:*:*:workgroup/e???????????????-*
              - arn:aws:athena:*:*:datacatalog/e???????????????-*
          - Sid: BedrockAccess
            Effect: Allow
            Action:
              - bedrock:*
            Resource:
              - arn:aws:bedrock:*:*:inference-profile/*
              - arn:aws:bedrock:*:*:application-inference-profile/*
              - arn:aws:bedrock:*::foundation-model/*
          - Sid: CostAndUsageReportAccess
            Effect: Allow
            Action:
              - cur:Describe*
              - cur:Get*
              - cur:PutReportDefinition
            Resource: '*'
          - Sid: BCMDataExportsAccess
            Effect: Allow
            Action:
              - bcm-data-exports:*
            Resource:
              - arn:aws:bcm-data-exports:*:*:export/*
              - arn:aws:bcm-data-exports:*:*:table/*
          - Sid: CloudWatchAccess
            Effect: Allow
            Action:
              - cloudwatch:*
            Resource:
              - arn:aws:cloudwatch:*:*:alarm:e???????????????-*
          - Sid: EC2Access
            Effect: Allow
            Action:
              - ec2:*
            Resource: '*'
          - Sid: ECRAccess
            Effect: Allow
            Action:
              - ecr:*
            Resource: arn:aws:ecr:*:*:repository/e???????????????-*
          - Sid: ECRAuthTokenAccess
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EFSAccess
            Effect: Allow
            Action:
              - elasticfilesystem:*
            Resource:
              - arn:aws:elasticfilesystem:*:*:file-system/*
              - arn:aws:elasticfilesystem:*:*:access-point/*
          - Sid: EKSAccess
            Effect: Allow
            Action:
              - eks:*
            Resource:
              - arn:aws:eks:*:*:cluster/e???????????????-*
              - arn:aws:eks:*:*:nodegroup/e???????????????-*/*/*
              - arn:aws:eks:*:*:access-entry/e???????????????-*/*
              - arn:aws:eks:*:*:addon/e???????????????-*/*/*
              - arn:aws:eks:*:*:podidentityassociation/e???????????????-*/*
          - Sid: EKSDescribeAddonVersionsAccess
            Effect: Allow
            Action:
              - eks:DescribeAddonVersions
            Resource: '*'
          - Sid: ElastiCacheAccess
            Effect: Allow
            Action:
              - elasticache:*
            Resource:
              - arn:aws:elasticache:*:*:cluster:e???????????????-*
              - arn:aws:elasticache:*:*:replicationgroup:e???????????????-*
              - arn:aws:elasticache:*:*:parametergroup:e???????????????-*
              - arn:aws:elasticache:*:*:subnetgroup:e???????????????-*
          - Sid: ELBAccess
            Effect: Allow
            Action:
              - elasticloadbalancing:*
            Resource: '*'
          - Sid: GlueAccess
            Effect: Allow
            Action:
              - glue:*
            Resource:
              - arn:aws:glue:*:*:catalog
              - arn:aws:glue:*:*:database/e???????????????*
              - arn:aws:glue:*:*:table/e???????????????*/*
          - Sid: IAMAccess
            Effect: Allow
            Action:
              - iam:*
            Resource:
              - arn:aws:iam::*:role/e???????????????-*
              - arn:aws:iam::*:policy/e???????????????-*
              - arn:aws:iam::*:instance-profile/e???????????????-*
              - arn:aws:iam::*:policy/AmazonEKS_*
              - arn:aws:iam::*:oidc-provider/oidc.eks.*.amazonaws.com/*
          - Sid: IAMSessionContextAccess
            Effect: Allow
            Action:
              - iam:GetRole
            Resource: '*'
          - Sid: IAMServiceLinkedRoleAccess
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: arn:aws:iam::*:role/aws-service-role/*
            Condition:
              StringLike:
                'iam:AWSServiceName':
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
                  - eks-fargate-pods.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
                  - opensearchservice.amazonaws.com
                  - backup.amazonaws.com
                  - elasticfilesystem.amazonaws.com
          - Sid: KMSAccess
            Effect: Allow
            Action:
              - kms:*
            Resource:
              - arn:aws:kms:*:*:key/*
              - arn:aws:kms:*:*:alias/e???????????????-*
              - arn:aws:kms:*:*:alias/eks/e???????????????-*
          - Sid: KMSAccountLevelAccess
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:ListAliases
            Resource: '*'
          - Sid: CloudWatchLogsAccess
            Effect: Allow
            Action:
              - logs:*
            Resource:
              - arn:aws:logs:*:*:log-group:e???????????????-*
              - arn:aws:logs:*:*:log-group:/aws/*/e???????????????-*
              - arn:aws:logs:*:*:log-group:/????????-????-????-????-????????????/*
          - Sid: CloudWatchLogsDescribeAccess
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: '*'
          - Sid: RDSAccess
            Effect: Allow
            Action:
              - rds:*
              - rds-db:*
            Resource:
              - arn:aws:rds:*:*:db:e???????????????-*
              - arn:aws:rds:*:*:cluster:e???????????????-*
              - arn:aws:rds:*:*:pg:e???????????????-*
              - arn:aws:rds:*:*:subgrp:e???????????????-*
              - arn:aws:rds:*:*:es:e???????????????-*
              - arn:aws:rds:*:*:es:db-event-sub-*
              - arn:aws:rds-db:*:*:dbuser:*/*
          - Sid: RDSDescribeAccess
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
            Resource: '*'
          - Sid: ResourceGroupsAccess
            Effect: Allow
            Action:
              - resource-groups:*
            Resource: arn:aws:resource-groups:*:*:group/e???????????????-*
          - Sid: Route53Access
            Effect: Allow
            Action:
              - route53:*
            Resource: '*'
          - Sid: S3Access
            Effect: Allow
            Action:
              - s3:*
            Resource:
              - arn:aws:s3:::e???????????????-*
              - arn:aws:s3:::e???????????????-*/*
          - Sid: S3ListAllMyBucketsAccess
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
              - secretsmanager:*
            Resource:
              - arn:aws:secretsmanager:*:*:secret:e???????????????-*
              - arn:aws:secretsmanager:*:*:secret:mks*
              - arn:aws:secretsmanager:*:*:secret:rds!*
              - arn:aws:secretsmanager:*:*:secret:grafana/????????-????-????-????-????????????-*/*
          - Sid: SNSAccess
            Effect: Allow
            Action:
              - sns:*
            Resource:
              - arn:aws:sns:*:*:e???????????????-*
              - arn:aws:sns:*:*:db-event-notifications
          - Sid: SQSAccess
            Effect: Allow
            Action:
              - sqs:*
            Resource: arn:aws:sqs:*:*:e???????????????-*
          - Sid: STSAssumeRoleAccess
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:AssumeRoleWithWebIdentity
            Resource: arn:aws:iam::*:role/e???????????????-*
          - Sid: STSIdentityAccess
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - sts:DecodeAuthorizationMessage
              - sts:GetAccessKeyInfo
            Resource: '*'
          - Sid: WAFv2Access
            Effect: Allow
            Action:
              - wafv2:*
            Resource:
              - arn:aws:wafv2:*:*:regional/webacl/e???????????????-*/*
              - arn:aws:wafv2:*:*:global/webacl/e???????????????-*/*
          - Sid: TaggingAccess
            Effect: Allow
            Action:
              - tag:*
            Resource: '*'

  EntDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Path: !Ref RolePath
      Description: !Ref RoleDescription
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref EntAwsAccountArn
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref RoleStsExternalId
              - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Ref EntDeployPolicy

  CallbackLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CallbackLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CallbackLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json, urllib.request, hmac, hashlib, base64, signal
          import cfnresponse


          class HardTimeout(Exception):
              pass


          def _raise_timeout(*_):
              raise HardTimeout()


          def handler(event, context):
              if event['RequestType'] != 'Create':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              # urllib's timeout covers socket ops only; signal.alarm guarantees
              # we always send a CFN response within Lambda's outer Timeout, even
              # if the runtime wedges below the urllib layer.
              signal.signal(signal.SIGALRM, _raise_timeout)
              signal.alarm(45)

              reason = 'Unknown error.'
              try:
                  props = event['ResourceProperties']
                  payload = {
                      'stackId': event['StackId'],
                      'roleArn': props['RoleArn'],
                      'externalId': props.get('ExternalId', ''),
                      'region': props['Region'],
                      'tenantName': props.get('TenantName', ''),
                  }
                  body = json.dumps(payload).encode('utf-8')
                  # HMAC keyed by EntWebhookSecret (NoEcho), NOT ExternalId.
                  # ExternalId is plaintext in the trust policy and visible via
                  # iam:GetRole / CloudTrail by AWS design — using it as the
                  # HMAC key would let anyone with iam:GetRole access in this
                  # account forge callbacks.
                  key = props['WebhookSecret'].encode('utf-8')
                  sig = base64.b64encode(
                      hmac.new(key, body, hashlib.sha256).digest()
                  ).decode()
                  req = urllib.request.Request(
                      props['CallbackUrl'],
                      data=body,
                      headers={
                          'Content-Type': 'application/json',
                          'X-Ent-Signature': sig,
                      },
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      if 200 <= resp.status < 300:
                          cfnresponse.send(
                              event, context, cfnresponse.SUCCESS, {}
                          )
                          return
                      reason = (
                          f'Ent endpoint returned HTTP {resp.status}. '
                          'Please retry by deleting and re-creating this stack.'
                      )
              except HardTimeout:
                  reason = (
                      'Timed out reaching Ent endpoint after 45s. Please retry.'
                  )
              except Exception as e:
                  reason = (
                      f'Could not reach Ent endpoint at '
                      f'{event.get("ResourceProperties", {}).get("CallbackUrl")}: '
                      f'{e}. Please retry.'
                  )
              finally:
                  signal.alarm(0)

              cfnresponse.send(
                  event, context, cfnresponse.FAILED, {}, reason=reason
              )

  EntDeployCallback:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: EntDeployRole
    Properties:
      ServiceToken: !GetAtt CallbackLambda.Arn
      RoleArn: !GetAtt EntDeployRole.Arn
      ExternalId: !Ref RoleStsExternalId
      WebhookSecret: !Ref EntWebhookSecret
      Region: !Ref AWS::Region
      CallbackUrl: !Ref EntCallbackUrl
      TenantName: !Ref EntTenantName

Outputs:
  RoleArn:
    Description: The ARN of the role
    Value: !GetAtt EntDeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RoleArn

  RoleName:
    Description: The name of the role
    Value: !Ref EntDeployRole
    Export:
      Name: !Sub ${AWS::StackName}-RoleName

  PolicyArn:
    Description: The ARN of the policy
    Value: !Ref EntDeployPolicy
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArn
