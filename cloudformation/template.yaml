AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Role for cross-account access with full permissions for deployment

Parameters:
  EntAwsAccountArn:
    Type: String
    Default: arn:aws:iam::051759900972:role/prod-uswest1-eks-pi-1-20251203221124633900000005
    Description: The AWS ARN that can assume this role

  RoleStsExternalId:
    Type: String
    Default: ''
    Description: STS ExternalId condition value to use with the role

  RoleName:
    Type: String
    Default: HomeProdAssumeAdmin
    Description: IAM role name

  RolePath:
    Type: String
    Default: /
    Description: Path of IAM role

  RoleDescription:
    Type: String
    Default: Role that allows HomeDev SSO to assume AdministratorAccess role
    Description: IAM Role description

  PolicyNamePrefix:
    Type: String
    Default: EntHomeAccess
    Description: >
      Name prefix for the four managed policies, applied as <prefix>Compute,
      <prefix>Data, <prefix>Security, and <prefix>Platform. Defaults to
      EntHomeAccess to match the Terraform, CDK, and Pulumi variants. Override it
      if you need more than one deploy-role stack in the same AWS account, since
      IAM managed-policy names are account-global.

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:iam::[0-9]{12}:policy/.+)?$'
    ConstraintDescription: Must be empty or an IAM policy ARN (arn:<partition>:iam::<account>:policy/<name>).
    Description: >
      Opt-in privilege-escalation guard. ARN of the permissions boundary every role the deploy role
      creates under role/e???????????????-* must carry (your own policy, or the PolicyArnBoundary
      output). Empty (default) leaves the guard off. Set it only after Ent has set the same ARN on
      your tenant, or deploys are denied.

  OwnerTagKey:
    Type: String
    Default: ''
    AllowedPattern: '^(?![aA][wW][sS]:)[\p{L}\p{Z}\p{N}_.:/=+@-]{0,128}$'
    ConstraintDescription: Must be a valid IAM tag key that does not start with aws:.
    Description: >
      Opt-in ownership-tag guard. Tag key (e.g. "Owner Role") every role the deploy role creates
      under role/e???????????????-* must carry with value OwnerTagValue. Empty (default) leaves the
      guard off. Set it only after Ent has set the same tag on your tenant, or deploys are denied.

  OwnerTagValue:
    Type: String
    Default: ''
    AllowedPattern: '^[\p{L}\p{Z}\p{N}_.:/=+@-]{0,256}$'
    ConstraintDescription: Must be a valid IAM tag value.
    Description: Value the OwnerTagKey tag must have. Required when OwnerTagKey is set.

Rules:
  OwnerTagValueRequired:
    RuleCondition: !Not [!Equals [!Ref OwnerTagKey, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref OwnerTagValue, '']]
        AssertDescription: OwnerTagValue is required when OwnerTagKey is set.

Conditions:
  HasExternalId: !Not [!Equals [!Ref RoleStsExternalId, '']]
  HasBoundaryGuard: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  HasOwnerTagGuard: !Not [!Equals [!Ref OwnerTagKey, '']]

Resources:
  EntDeployPolicyCompute:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Compute'
      Description: Ent Home deploy permissions (Compute & Networking) — 1 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EC2Access
            Effect: Allow
            Action:
              - ec2:*
            Resource: '*'
          - Sid: ECRAccess
            Effect: Allow
            Action:
              - ecr:*
            Resource: !Sub 'arn:${AWS::Partition}:ecr:*:*:repository/e???????????????-*'
          - Sid: ECRAuthTokenAccess
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EKSAccess
            Effect: Allow
            Action:
              - eks:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:*:*:cluster/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:nodegroup/e???????????????-*/*/*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:access-entry/e???????????????-*/*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:addon/e???????????????-*/*/*'
              - !Sub 'arn:${AWS::Partition}:eks:*:*:podidentityassociation/e???????????????-*/*'
          - Sid: EKSDescribeAddonVersionsAccess
            Effect: Allow
            Action:
              - eks:DescribeAddonVersions
            Resource: '*'
          - Sid: ELBAccess
            Effect: Allow
            Action:
              - elasticloadbalancing:*
            Resource: '*'
          - Sid: Route53Access
            Effect: Allow
            Action:
              - route53:*
            Resource: '*'

  EntDeployPolicyData:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Data'
      Description: Ent Home deploy permissions (Data & Storage) — 2 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AthenaAccess
            Effect: Allow
            Action:
              - athena:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:athena:*:*:workgroup/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:athena:*:*:datacatalog/e???????????????-*'
          - Sid: EFSAccess
            Effect: Allow
            Action:
              - elasticfilesystem:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:elasticfilesystem:*:*:file-system/*'
              - !Sub 'arn:${AWS::Partition}:elasticfilesystem:*:*:access-point/*'
          - Sid: ElastiCacheAccess
            Effect: Allow
            Action:
              - elasticache:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:cluster:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:replicationgroup:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:parametergroup:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:subnetgroup:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:user:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:elasticache:*:*:usergroup:e???????????????-*'
          - Sid: GlueAccess
            Effect: Allow
            Action:
              - glue:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:glue:*:*:catalog'
              - !Sub 'arn:${AWS::Partition}:glue:*:*:database/e???????????????*'
              - !Sub 'arn:${AWS::Partition}:glue:*:*:table/e???????????????*/*'
              - !Sub 'arn:${AWS::Partition}:glue:*:*:userDefinedFunction/e???????????????*/*'
          - Sid: RDSAccess
            Effect: Allow
            Action:
              - rds:*
              - rds-db:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:rds:*:*:db:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:snapshot:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:cluster:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:pg:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:subgrp:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:es:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:rds:*:*:es:db-event-sub-*'
              - !Sub 'arn:${AWS::Partition}:rds-db:*:*:dbuser:*/*'
          - Sid: RDSDescribeAccess
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
            Resource: '*'
          - Sid: S3Access
            Effect: Allow
            Action:
              - s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:s3:::e???????????????-*/*'
          - Sid: S3ListAllMyBucketsAccess
            Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'
          - Sid: S3AccountPublicAccessBlockAccess
            Effect: Allow
            Action:
              - s3:GetAccountPublicAccessBlock
            Resource: '*'

  EntDeployPolicySecurity:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Security'
      Description: Ent Home deploy permissions (Identity & Security) — 3 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CertificateManagerAccess
            Effect: Allow
            Action:
              - acm:*
            Resource: '*'
          - Sid: IAMAccess
            Effect: Allow
            Action:
              - iam:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::*:role/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:policy/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:instance-profile/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:iam::*:policy/AmazonEKS_*'
              - !Sub 'arn:${AWS::Partition}:iam::*:oidc-provider/oidc.eks.*.amazonaws.com/*'
          - Sid: IAMSessionContextAccess
            Effect: Allow
            Action:
              - iam:GetRole
            Resource: '*'
          - Sid: IAMServiceLinkedRoleAccess
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/aws-service-role/*'
            Condition:
              StringLike:
                'iam:AWSServiceName':
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
                  - eks-fargate-pods.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
                  - opensearchservice.amazonaws.com
                  - backup.amazonaws.com
                  - elasticfilesystem.amazonaws.com
          - Sid: OrgBootstrapRoleCleanupAccess
            Effect: Allow
            Action:
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:DetachRolePolicy
              - iam:DeleteRolePolicy
              - iam:DeleteRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/Home*OrgBootstrap'
          - Sid: KMSAccess
            Effect: Allow
            Action:
              - kms:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:kms:*:*:key/*'
              - !Sub 'arn:${AWS::Partition}:kms:*:*:alias/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:kms:*:*:alias/eks/e???????????????-*'
          - Sid: KMSAccountLevelAccess
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:ListAliases
            Resource: '*'
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
              - secretsmanager:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:mks*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:rds!*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:grafana/????????-????-????-????-????????????-*/*'
          - Sid: STSAssumeRoleAccess
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:AssumeRoleWithWebIdentity
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/e???????????????-*'
          - Sid: STSIdentityAccess
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - sts:DecodeAuthorizationMessage
              - sts:GetAccessKeyInfo
            Resource: '*'
          - Sid: WAFv2Access
            Effect: Allow
            Action:
              - wafv2:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:wafv2:*:*:regional/webacl/e???????????????-*/*'
              - !Sub 'arn:${AWS::Partition}:wafv2:*:*:global/webacl/e???????????????-*/*'

  EntDeployPolicyPlatform:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Platform'
      Description: Ent Home deploy permissions (Observability & Platform) — 4 of 4 functional policies
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockAccess
            Effect: Allow
            Action:
              - bedrock:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
          - Sid: CostAndUsageReportAccess
            Effect: Allow
            Action:
              - cur:Describe*
              - cur:Get*
              - cur:PutReportDefinition
            Resource: '*'
          - Sid: BCMDataExportsAccess
            Effect: Allow
            Action:
              - bcm-data-exports:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:bcm-data-exports:*:*:export/*'
              - !Sub 'arn:${AWS::Partition}:bcm-data-exports:*:*:table/*'
          - Sid: CloudWatchAccess
            Effect: Allow
            Action:
              - cloudwatch:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudwatch:*:*:alarm:e???????????????-*'
          - Sid: CloudWatchLogsAccess
            Effect: Allow
            Action:
              - logs:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:/aws/*/e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:logs:*:*:log-group:/????????-????-????-????-????????????/*'
          - Sid: CloudWatchLogsDescribeAccess
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: '*'
          - Sid: ResourceGroupsAccess
            Effect: Allow
            Action:
              - resource-groups:*
            Resource: !Sub 'arn:${AWS::Partition}:resource-groups:*:*:group/e???????????????-*'
          - Sid: SNSAccess
            Effect: Allow
            Action:
              - sns:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:sns:*:*:e???????????????-*'
              - !Sub 'arn:${AWS::Partition}:sns:*:*:db-event-notifications'
          - Sid: SQSAccess
            Effect: Allow
            Action:
              - sqs:*
            Resource: !Sub 'arn:${AWS::Partition}:sqs:*:*:e???????????????-*'
          - Sid: TaggingAccess
            Effect: Allow
            Action:
              - tag:*
            Resource: '*'
          - Sid: ServiceQuotasEC2Access
            Effect: Allow
            Action:
              - servicequotas:GetServiceQuota
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota
              - servicequotas:RequestServiceQuotaIncrease
            Resource: !Sub 'arn:${AWS::Partition}:servicequotas:*:*:ec2/*'
          - Sid: ServiceQuotasListAccess
            Effect: Allow
            Action:
              - servicequotas:ListServiceQuotas
            Resource: '*'

  # Ent's default permissions boundary: an ARN a customer without its own boundary can pass as
  # PermissionsBoundaryArn to switch on the boundary guard. NOT attached to EntDeployRole itself via
  # ManagedPolicyArns below -- it would strip EntDeployRole's own iam:*/sts:AssumeRole grants on the
  # glob, breaking it. Named outside the e???????????????-* glob so IAMAccess (scoped to that glob)
  # can't modify or delete it.
  EntDeployPolicyBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}Boundary'
      Description: Permissions boundary for IAM roles created by the deploy role under role/e???????????????-*. Not attached to the deploy role itself.
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BoundaryBaseline
            Effect: Allow
            Action:
              - acm:*
              - athena:*
              - bcm-data-exports:*
              - bedrock:*
              - cloudwatch:*
              - cur:Describe*
              - cur:Get*
              - cur:PutReportDefinition
              - ec2:*
              - ecr:*
              - eks:*
              - elasticache:*
              - elasticfilesystem:*
              - elasticloadbalancing:*
              - glue:*
              - kms:*
              - logs:*
              - rds:*
              - rds-db:*
              - resource-groups:*
              - route53:*
              - s3:*
              - secretsmanager:*
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:GetServiceQuota
              - servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota
              - servicequotas:ListServiceQuotas
              - servicequotas:RequestServiceQuotaIncrease
              - sns:*
              - sqs:*
              - tag:*
              - wafv2:*
            Resource: '*'
          - Sid: BoundaryDenyIAM
            Effect: Deny
            Action: iam:*
            Resource: '*'
          - Sid: BoundaryDenySTSAssumeRole
            Effect: Deny
            Action:
              - sts:AssumeRole
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Resource: '*'

  # Opt-in privilege-escalation guards (PLA-6063). IAMAccess grants iam:* on role/e???????????????-*
  # and STSAssumeRoleAccess grants sts:AssumeRole on the same glob, so with neither guard on the
  # deploy role can create a role under the glob, give it "*:*" inline, and assume it. Both are off
  # by default. Every role ent-platform creates is named e<hash15>-..., so turn a guard on only once
  # Ent Home sends the same boundary ARN / tag for the tenant. Statements mirror
  # EntHomeAccess.boundary-guard.json and EntHomeAccess.owner-tag-guard.json; keep them in lockstep.
  # Both policies are named outside the glob, and EntDeployRole has no IAM permission on itself, so
  # it can neither edit nor detach them.
  EntDeployPolicyBoundaryGuard:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasBoundaryGuard
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}BoundaryGuard'
      Description: Requires the customer's permissions boundary on every role the Ent deploy role creates or grants permissions to under role/e???????????????-*, and keeps it from being removed or edited.
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # CreateRole: a new role must carry the boundary. PutRolePermissionsBoundary: the boundary
          # can only ever be set TO this ARN. PutRolePolicy/AttachRolePolicy: no permissions can be
          # added to a role that lacks it, which covers roles created before the guard was on.
          - Sid: IAMBoundaryEnforcement
            Effect: Deny
            Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/e???????????????-*'
            Condition:
              StringNotEquals:
                'iam:PermissionsBoundary': !Ref PermissionsBoundaryArn
          - Sid: IAMBoundaryRemovalProtection
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/e???????????????-*'
          - Sid: IAMBoundaryPolicyProtection
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
            Resource: !Ref PermissionsBoundaryArn

  # The condition keys embed the tag key (aws:RequestTag/<key>), and CloudFormation can't put an
  # intrinsic function in a map key, so this document is one substituted JSON string.
  EntDeployPolicyOwnerTagGuard:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasOwnerTagGuard
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}OwnerTagGuard'
      Description: Requires the customer's ownership tag on every role the Ent deploy role creates under role/e???????????????-*, and keeps it from being changed or removed.
      Path: /
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "IAMOwnerTagEnforcement",
              "Effect": "Deny",
              "Action": "iam:CreateRole",
              "Resource": "arn:${AWS::Partition}:iam::*:role/e???????????????-*",
              "Condition": {"StringNotEquals": {"aws:RequestTag/${OwnerTagKey}": "${OwnerTagValue}"}}
            },
            {
              "Sid": "IAMOwnerTagValueProtection",
              "Effect": "Deny",
              "Action": "iam:TagRole",
              "Resource": "arn:${AWS::Partition}:iam::*:role/e???????????????-*",
              "Condition": {
                "ForAnyValue:StringEqualsIgnoreCase": {"aws:TagKeys": "${OwnerTagKey}"},
                "StringNotEquals": {"aws:RequestTag/${OwnerTagKey}": "${OwnerTagValue}"}
              }
            },
            {
              "Sid": "IAMOwnerTagRemovalProtection",
              "Effect": "Deny",
              "Action": "iam:UntagRole",
              "Resource": "arn:${AWS::Partition}:iam::*:role/e???????????????-*",
              "Condition": {"ForAnyValue:StringEqualsIgnoreCase": {"aws:TagKeys": "${OwnerTagKey}"}}
            }
          ]
        }

  EntDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Path: !Ref RolePath
      Description: !Ref RoleDescription
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        # When an ExternalId is set, sts:AssumeRole keeps the ExternalId condition (confused-deputy
        # protection) but sts:TagSession is split into its own statement WITHOUT the condition. STS
        # only populates sts:ExternalId when authorizing sts:AssumeRole, not sts:TagSession; the Ent
        # Home deploy identity uses EKS Pod Identity, whose transitive session tags force an
        # sts:TagSession authorization alongside every cross-account assume, so gating TagSession on
        # sts:ExternalId would deny it. With no ExternalId, both actions stay in one statement.
        Statement: !If
          - HasExternalId
          - - Sid: EntDeployAssumeRole
              Effect: Allow
              Principal:
                AWS: !Ref EntAwsAccountArn
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  sts:ExternalId: !Ref RoleStsExternalId
            - Sid: EntDeployTagSession
              Effect: Allow
              Principal:
                AWS: !Ref EntAwsAccountArn
              Action: sts:TagSession
          - - Effect: Allow
              Principal:
                AWS: !Ref EntAwsAccountArn
              Action:
                - sts:AssumeRole
                - sts:TagSession
      ManagedPolicyArns:
        - !Ref EntDeployPolicyCompute
        - !Ref EntDeployPolicyData
        - !Ref EntDeployPolicySecurity
        - !Ref EntDeployPolicyPlatform
        - !If [HasBoundaryGuard, !Ref EntDeployPolicyBoundaryGuard, !Ref AWS::NoValue]
        - !If [HasOwnerTagGuard, !Ref EntDeployPolicyOwnerTagGuard, !Ref AWS::NoValue]

Outputs:
  RoleArn:
    Description: The ARN of the role
    Value: !GetAtt EntDeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RoleArn

  RoleName:
    Description: The name of the role
    Value: !Ref EntDeployRole
    Export:
      Name: !Sub ${AWS::StackName}-RoleName

  PolicyArnCompute:
    Description: The ARN of the Compute & Networking managed policy
    Value: !Ref EntDeployPolicyCompute
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnCompute
  PolicyArnData:
    Description: The ARN of the Data & Storage managed policy
    Value: !Ref EntDeployPolicyData
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnData
  PolicyArnSecurity:
    Description: The ARN of the Identity & Security managed policy
    Value: !Ref EntDeployPolicySecurity
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnSecurity
  PolicyArnPlatform:
    Description: The ARN of the Observability & Platform managed policy
    Value: !Ref EntDeployPolicyPlatform
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnPlatform
  PolicyArn:
    Description: Deprecated — points at the Identity & Security policy for backward compatibility; use the per-domain PolicyArn* outputs
    Value: !Ref EntDeployPolicySecurity
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArn
  PolicyArnBoundary:
    Description: The ARN of the permissions-boundary policy applied to IAM roles the deploy role creates under role/e???????????????-*. Not attached to the deploy role itself.
    Value: !Ref EntDeployPolicyBoundary
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArnBoundary
