AWSTemplateFormatVersion: '2010-09-09'
Description: IAM Role for cross-account access with full permissions for deployment

Parameters:
  EntAwsAccountArn:
    Type: String
    Default: arn:aws:iam::000000000000:root
    Description: The AWS ARN that can assume this role

  RoleStsExternalId:
    Type: String
    Default: ''
    Description: STS ExternalId condition value to use with the role

  RoleName:
    Type: String
    Default: HomeProdAssumeAdmin
    Description: IAM role name

  RolePath:
    Type: String
    Default: /
    Description: Path of IAM role

  RoleDescription:
    Type: String
    Default: Role that allows HomeDev SSO to assume AdministratorAccess role
    Description: IAM Role description

Conditions:
  HasExternalId: !Not [!Equals [!Ref RoleStsExternalId, '']]

Resources:
  EntDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EntAdditionalPermissions
      Description: Custom policy for permissions needed by Ent Home to deploy and manage resources in customer accounts
      Path: /
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CertificateManagerAccess
            Effect: Allow
            Action:
              - acm:*
            Resource: '*'
          - Sid: AthenaAccess
            Effect: Allow
            Action:
              - athena:*
            Resource:
              - arn:aws:athena:*:*:workgroup/e???????????????-*
              - arn:aws:athena:*:*:datacatalog/e???????????????-*
          - Sid: BedrockAccess
            Effect: Allow
            Action:
              - bedrock:*
            Resource:
              - arn:aws:bedrock:*:*:inference-profile/*
              - arn:aws:bedrock:*:*:application-inference-profile/*
          - Sid: CostAndUsageReportReadAccess
            Effect: Allow
            Action:
              - cur:Describe*
              - cur:Get*
            Resource: '*'
          - Sid: CloudWatchAccess
            Effect: Allow
            Action:
              - cloudwatch:*
            Resource:
              - arn:aws:cloudwatch:*:*:alarm:e???????????????-*
          - Sid: EC2Access
            Effect: Allow
            Action:
              - ec2:*
            Resource: '*'
          - Sid: ECRAccess
            Effect: Allow
            Action:
              - ecr:*
            Resource: arn:aws:ecr:*:*:repository/e???????????????-*
          - Sid: EKSAccess
            Effect: Allow
            Action:
              - eks:*
            Resource:
              - arn:aws:eks:*:*:cluster/e???????????????-*
              - arn:aws:eks:*:*:nodegroup/e???????????????-*/*/*
              - arn:aws:eks:*:*:access-entry/e???????????????-*/*
              - arn:aws:eks:*:*:addon/e???????????????-*/*/*
          - Sid: ElastiCacheAccess
            Effect: Allow
            Action:
              - elasticache:*
            Resource:
              - arn:aws:elasticache:*:*:replicationgroup:e???????????????-*
              - arn:aws:elasticache:*:*:parametergroup:e???????????????-*
              - arn:aws:elasticache:*:*:subnetgroup:e???????????????-*
          - Sid: ELBAccess
            Effect: Allow
            Action:
              - elasticloadbalancing:*
            Resource: '*'
          - Sid: GlueAccess
            Effect: Allow
            Action:
              - glue:*
            Resource:
              - arn:aws:glue:*:*:catalog
              - arn:aws:glue:*:*:database/e???????????????-*
              - arn:aws:glue:*:*:table/e???????????????-*/*
          - Sid: IAMAccess
            Effect: Allow
            Action:
              - iam:*
            Resource:
              - arn:aws:iam::*:role/e???????????????-*
              - arn:aws:iam::*:policy/e???????????????-*
              - arn:aws:iam::*:instance-profile/e???????????????-*
          - Sid: IAMServiceLinkedRoleAccess
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: arn:aws:iam::*:role/aws-service-role/*
            Condition:
              StringLike:
                'iam:AWSServiceName':
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
                  - eks-fargate-pods.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
                  - opensearchservice.amazonaws.com
          - Sid: KMSAccess
            Effect: Allow
            Action:
              - kms:*
            Resource:
              - arn:aws:kms:*:*:key/*
              - arn:aws:kms:*:*:alias/e???????????????-*
          - Sid: CloudWatchLogsAccess
            Effect: Allow
            Action:
              - logs:*
            Resource:
              - arn:aws:logs:*:*:log-group:e???????????????-*
              - arn:aws:logs:*:*:log-group:e???????????????-*:*
              - arn:aws:logs:*:*:log-group:/aws/eks/e???????????????-*/*
          - Sid: RDSAccess
            Effect: Allow
            Action:
              - rds:*
              - rds-db:*
            Resource:
              - arn:aws:rds:*:*:db:e???????????????-*
              - arn:aws:rds:*:*:cluster:e???????????????-*
              - arn:aws:rds:*:*:pg:e???????????????-*
              - arn:aws:rds:*:*:subgrp:e???????????????-*
              - arn:aws:rds:*:*:es:e???????????????-*
              - arn:aws:rds-db:*:*:dbuser:*/*
          - Sid: ResourceGroupsAccess
            Effect: Allow
            Action:
              - resource-groups:*
            Resource: arn:aws:resource-groups:*:*:group/e???????????????-*
          - Sid: Route53Access
            Effect: Allow
            Action:
              - route53:*
            Resource: '*'
          - Sid: S3Access
            Effect: Allow
            Action:
              - s3:*
            Resource:
              - arn:aws:s3:::e???????????????-*
              - arn:aws:s3:::e???????????????-*/*
          - Sid: SecretsManagerAccess
            Effect: Allow
            Action:
              - secretsmanager:*
            Resource:
              - arn:aws:secretsmanager:*:*:secret:e???????????????-*
              - arn:aws:secretsmanager:*:*:secret:mks*
          - Sid: SNSAccess
            Effect: Allow
            Action:
              - sns:*
            Resource: arn:aws:sns:*:*:e???????????????-*
          - Sid: SQSAccess
            Effect: Allow
            Action:
              - sqs:*
            Resource: arn:aws:sqs:*:*:e???????????????-*
          - Sid: STSAssumeRoleAccess
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:AssumeRoleWithWebIdentity
            Resource: arn:aws:iam::*:role/e???????????????-*
          - Sid: STSIdentityAccess
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - sts:DecodeAuthorizationMessage
              - sts:GetAccessKeyInfo
            Resource: '*'
          - Sid: TaggingAccess
            Effect: Allow
            Action:
              - tag:*
            Resource: '*'

  EntDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Path: !Ref RolePath
      Description: !Ref RoleDescription
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref EntAwsAccountArn
            Action: sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref RoleStsExternalId
              - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Ref EntDeployPolicy

Outputs:
  RoleArn:
    Description: The ARN of the role
    Value: !GetAtt EntDeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RoleArn

  RoleName:
    Description: The name of the role
    Value: !Ref EntDeployRole
    Export:
      Name: !Sub ${AWS::StackName}-RoleName

  PolicyArn:
    Description: The ARN of the policy
    Value: !Ref EntDeployPolicy
    Export:
      Name: !Sub ${AWS::StackName}-PolicyArn
