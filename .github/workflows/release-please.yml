name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release commit, tag, and GitHub Release
      pull-requests: write      # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The org disables "Allow GitHub Actions to create and approve pull requests",
      # so the default GITHUB_TOKEN cannot open release-please's release PR. We
      # authenticate as a GitHub App instead — that restriction only governs the
      # automatic GITHUB_TOKEN, not an App/PAT identity. Publish is still chained
      # below via needs/if, so we don't depend on the release tag re-triggering a workflow.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write          # OIDC for aws-actions/configure-aws-credentials
    uses: ./.github/workflows/publish.yml
    with:
      environment: prod
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
