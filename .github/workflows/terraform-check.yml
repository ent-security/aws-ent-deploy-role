name: Terraform checks

# Size-lint, format, validate, and zero-diff-guard the Terraform/OpenTofu roots. Runs
# credential-free — no AWS access needed because we only fmt/validate and plan-render the policies
# (partition is derived from the region offline). The size lint fails the build if any functional
# policy file approaches AWS's 6144-character managed-policy limit.

on:
  pull_request:
    paths:
      - 'terraform/**'
      # Matches the four functional policy files (EntHomeAccess.<domain>.json) — a change to any of
      # them re-runs the guards.
      - 'EntHomeAccess*.json'
      - 'scripts/check-policy-size.sh'
      - '.github/workflows/terraform-check.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'EntHomeAccess*.json'
      - 'scripts/check-policy-size.sh'
      - '.github/workflows/terraform-check.yml'

permissions:
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: opentofu/setup-opentofu@v1

      - name: Managed-policy size lint — each functional file under the 6144-char IAM limit
        run: scripts/check-policy-size.sh

      - name: tofu fmt
        run: tofu fmt -recursive -check terraform/

      - name: Validate commercial root
        run: |
          tofu -chdir=terraform/commercial init -backend=false
          tofu -chdir=terraform/commercial validate

      - name: Validate govcloud root
        run: |
          tofu -chdir=terraform/govcloud init -backend=false
          tofu -chdir=terraform/govcloud validate

      - name: Zero-diff guard — each rendered managed policy matches its EntHomeAccess.<domain>.json file
        run: |
          tofu -chdir=terraform/modules/deploy-permissions init -backend=false
          tofu -chdir=terraform/modules/deploy-permissions test

      - name: Trust-policy guard — sts:TagSession never gated by sts:ExternalId
        run: |
          tofu -chdir=terraform/modules/commercial-trust init -backend=false
          tofu -chdir=terraform/modules/commercial-trust test
